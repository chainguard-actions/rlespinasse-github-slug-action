name: Test slug-maxlength input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: slug
        uses: .
        with:
          slug-maxlength: "10"

      - name: Assert GITHUB_REF_SLUG is truncated to maxlength 10
        run: |
          echo "GITHUB_REF_SLUG=$GITHUB_REF_SLUG"
          len=${#GITHUB_REF_SLUG}
          echo "Length: $len"
          if [ "$len" -gt 10 ]; then
            echo "FAIL: GITHUB_REF_SLUG length $len exceeds maxlength 10"
            exit 1
          fi
          if [ "$len" -eq 0 ]; then
            echo "FAIL: GITHUB_REF_SLUG is empty"
            exit 1
          fi
          echo "PASS: length $len is within maxlength 10"

      - name: Assert GITHUB_REF_NAME_SLUG is truncated to maxlength 10
        run: |
          echo "GITHUB_REF_NAME_SLUG=$GITHUB_REF_NAME_SLUG"
          len=${#GITHUB_REF_NAME_SLUG}
          echo "Length: $len"
          if [ "$len" -gt 10 ]; then
            echo "FAIL: GITHUB_REF_NAME_SLUG length $len exceeds maxlength 10"
            exit 1
          fi
          if [ "$len" -eq 0 ]; then
            echo "FAIL: GITHUB_REF_NAME_SLUG is empty"
            exit 1
          fi
          echo "PASS: length $len is within maxlength 10"

      - name: Assert GITHUB_REPOSITORY_SLUG is truncated to maxlength 10
        run: |
          echo "GITHUB_REPOSITORY_SLUG=$GITHUB_REPOSITORY_SLUG"
          len=${#GITHUB_REPOSITORY_SLUG}
          echo "Length: $len"
          if [ "$len" -gt 10 ]; then
            echo "FAIL: GITHUB_REPOSITORY_SLUG length $len exceeds maxlength 10"
            exit 1
          fi
          if [ "$len" -eq 0 ]; then
            echo "FAIL: GITHUB_REPOSITORY_SLUG is empty"
            exit 1
          fi
          echo "PASS: length $len is within maxlength 10"
