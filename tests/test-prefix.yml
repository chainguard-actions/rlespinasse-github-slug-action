name: Test prefix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          prefix: "MY_"
      - name: Debug - print all env vars with MY_ prefix
        run: |
          echo "=== All env vars with MY_ prefix ==="
          env | grep '^MY_' || true
          echo "=== All env vars with SLUG ==="
          env | grep -i slug || true
      - name: Assert MY_GITHUB_REPOSITORY_SLUG is set
        run: |
          echo "MY_GITHUB_REPOSITORY_SLUG: $MY_GITHUB_REPOSITORY_SLUG"
          if [ -z "$MY_GITHUB_REPOSITORY_SLUG" ]; then
            echo "FAIL: MY_GITHUB_REPOSITORY_SLUG is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert MY_GITHUB_REPOSITORY_SLUG contains no slash
        run: |
          echo "MY_GITHUB_REPOSITORY_SLUG: $MY_GITHUB_REPOSITORY_SLUG"
          if echo "$MY_GITHUB_REPOSITORY_SLUG" | grep -q '/'; then
            echo "FAIL: MY_GITHUB_REPOSITORY_SLUG contains a slash"
            exit 1
          fi
          echo "PASS"
      - name: Assert MY_GITHUB_REPOSITORY_OWNER_PART_SLUG is set
        run: |
          echo "MY_GITHUB_REPOSITORY_OWNER_PART_SLUG: $MY_GITHUB_REPOSITORY_OWNER_PART_SLUG"
          if [ -z "$MY_GITHUB_REPOSITORY_OWNER_PART_SLUG" ]; then
            echo "FAIL: MY_GITHUB_REPOSITORY_OWNER_PART_SLUG is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert MY_GITHUB_REPOSITORY_NAME_PART_SLUG is set
        run: |
          echo "MY_GITHUB_REPOSITORY_NAME_PART_SLUG: $MY_GITHUB_REPOSITORY_NAME_PART_SLUG"
          if [ -z "$MY_GITHUB_REPOSITORY_NAME_PART_SLUG" ]; then
            echo "FAIL: MY_GITHUB_REPOSITORY_NAME_PART_SLUG is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert MY_GITHUB_SHA_SHORT is set
        run: |
          echo "MY_GITHUB_SHA_SHORT: $MY_GITHUB_SHA_SHORT"
          if [ -z "$MY_GITHUB_SHA_SHORT" ]; then
            echo "FAIL: MY_GITHUB_SHA_SHORT is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert MY_GITHUB_REF_SLUG is set
        run: |
          echo "MY_GITHUB_REF_SLUG: $MY_GITHUB_REF_SLUG"
          if [ -z "$MY_GITHUB_REF_SLUG" ]; then
            echo "FAIL: MY_GITHUB_REF_SLUG is empty"
            exit 1
          fi
          echo "PASS"
