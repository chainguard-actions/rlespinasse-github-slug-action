name: Test prefix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          prefix: "CI_"
          short-length: "7"
      - name: Assert CI_GITHUB_REF_SLUG is set with prefix
        run: |
          echo "CI_GITHUB_REF_SLUG: $CI_GITHUB_REF_SLUG"
          if [ -z "$CI_GITHUB_REF_SLUG" ]; then
            echo "FAIL: CI_GITHUB_REF_SLUG is empty"
            exit 1
          fi
          echo "PASS: CI_GITHUB_REF_SLUG=$CI_GITHUB_REF_SLUG"
      - name: Assert CI_GITHUB_REPOSITORY_SLUG is set with prefix
        run: |
          echo "CI_GITHUB_REPOSITORY_SLUG: $CI_GITHUB_REPOSITORY_SLUG"
          if [ -z "$CI_GITHUB_REPOSITORY_SLUG" ]; then
            echo "FAIL: CI_GITHUB_REPOSITORY_SLUG is empty"
            exit 1
          fi
          echo "PASS: CI_GITHUB_REPOSITORY_SLUG=$CI_GITHUB_REPOSITORY_SLUG"
      - name: Assert CI_GITHUB_SHA_SHORT is set with prefix
        run: |
          echo "CI_GITHUB_SHA_SHORT: $CI_GITHUB_SHA_SHORT"
          if [ -z "$CI_GITHUB_SHA_SHORT" ]; then
            echo "FAIL: CI_GITHUB_SHA_SHORT is empty"
            exit 1
          fi
          echo "PASS: CI_GITHUB_SHA_SHORT=$CI_GITHUB_SHA_SHORT"
      - name: Assert CI_GITHUB_REF_SLUG_URL is set with prefix
        run: |
          echo "CI_GITHUB_REF_SLUG_URL: $CI_GITHUB_REF_SLUG_URL"
          if [ -z "$CI_GITHUB_REF_SLUG_URL" ]; then
            echo "FAIL: CI_GITHUB_REF_SLUG_URL is empty"
            exit 1
          fi
          echo "PASS: CI_GITHUB_REF_SLUG_URL=$CI_GITHUB_REF_SLUG_URL"
      - name: Assert non-prefixed GITHUB_REF_SLUG is NOT set
        run: |
          echo "GITHUB_REF_SLUG: $GITHUB_REF_SLUG"
          if [ -n "$GITHUB_REF_SLUG" ]; then
            echo "WARN: GITHUB_REF_SLUG is set when prefix is used (may be a default env var)"
          fi
          echo "PASS: check complete"
