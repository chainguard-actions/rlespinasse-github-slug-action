name: Test prefix input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run github-slug-action with prefix
        uses: .
        with:
          prefix: CI_

      - name: Assert prefixed GITHUB_REPOSITORY_SLUG is set
        run: |
          echo "CI_GITHUB_REPOSITORY_SLUG: $CI_GITHUB_REPOSITORY_SLUG"
          if [ -z "$CI_GITHUB_REPOSITORY_SLUG" ]; then
            echo "FAIL: CI_GITHUB_REPOSITORY_SLUG is empty"
            exit 1
          fi
          echo "PASS: CI_GITHUB_REPOSITORY_SLUG=$CI_GITHUB_REPOSITORY_SLUG"

      - name: Assert prefixed GITHUB_REF_SLUG is set
        run: |
          echo "CI_GITHUB_REF_SLUG: $CI_GITHUB_REF_SLUG"
          if [ -z "$CI_GITHUB_REF_SLUG" ]; then
            echo "FAIL: CI_GITHUB_REF_SLUG is empty"
            exit 1
          fi
          echo "PASS: CI_GITHUB_REF_SLUG=$CI_GITHUB_REF_SLUG"

      - name: Assert prefixed GITHUB_SHA_SHORT is set
        run: |
          echo "CI_GITHUB_SHA_SHORT: $CI_GITHUB_SHA_SHORT"
          if [ -z "$CI_GITHUB_SHA_SHORT" ]; then
            echo "FAIL: CI_GITHUB_SHA_SHORT is empty"
            exit 1
          fi
          echo "PASS: CI_GITHUB_SHA_SHORT=$CI_GITHUB_SHA_SHORT"

      - name: Assert prefixed GITHUB_REPOSITORY_OWNER_PART_SLUG is set
        run: |
          echo "CI_GITHUB_REPOSITORY_OWNER_PART_SLUG: $CI_GITHUB_REPOSITORY_OWNER_PART_SLUG"
          if [ -z "$CI_GITHUB_REPOSITORY_OWNER_PART_SLUG" ]; then
            echo "FAIL: CI_GITHUB_REPOSITORY_OWNER_PART_SLUG is empty"
            exit 1
          fi
          echo "PASS: CI_GITHUB_REPOSITORY_OWNER_PART_SLUG=$CI_GITHUB_REPOSITORY_OWNER_PART_SLUG"

      - name: Assert prefixed GITHUB_REPOSITORY_NAME_PART_SLUG is set
        run: |
          echo "CI_GITHUB_REPOSITORY_NAME_PART_SLUG: $CI_GITHUB_REPOSITORY_NAME_PART_SLUG"
          if [ -z "$CI_GITHUB_REPOSITORY_NAME_PART_SLUG" ]; then
            echo "FAIL: CI_GITHUB_REPOSITORY_NAME_PART_SLUG is empty"
            exit 1
          fi
          echo "PASS: CI_GITHUB_REPOSITORY_NAME_PART_SLUG=$CI_GITHUB_REPOSITORY_NAME_PART_SLUG"

      - name: Assert prefixed GITHUB_REF_NAME_SLUG is set
        run: |
          echo "CI_GITHUB_REF_NAME_SLUG: $CI_GITHUB_REF_NAME_SLUG"
          if [ -z "$CI_GITHUB_REF_NAME_SLUG" ]; then
            echo "FAIL: CI_GITHUB_REF_NAME_SLUG is empty"
            exit 1
          fi
          echo "PASS: CI_GITHUB_REF_NAME_SLUG=$CI_GITHUB_REF_NAME_SLUG"
