name: Test custom prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          prefix: MY_
        env:
          GITHUB_REF: refs/heads/feature-branch

      - name: Assert MY_GITHUB_REF_SLUG is set with prefix
        run: |
          echo "MY_GITHUB_REF_SLUG: $MY_GITHUB_REF_SLUG"
          if [ -z "$MY_GITHUB_REF_SLUG" ]; then
            echo "FAIL: MY_GITHUB_REF_SLUG is empty"
            exit 1
          fi
          echo "PASS: MY_GITHUB_REF_SLUG=$MY_GITHUB_REF_SLUG"

      - name: Assert MY_GITHUB_REPOSITORY_SLUG is set with prefix
        run: |
          echo "MY_GITHUB_REPOSITORY_SLUG: $MY_GITHUB_REPOSITORY_SLUG"
          if [ -z "$MY_GITHUB_REPOSITORY_SLUG" ]; then
            echo "FAIL: MY_GITHUB_REPOSITORY_SLUG is empty"
            exit 1
          fi
          echo "PASS: MY_GITHUB_REPOSITORY_SLUG=$MY_GITHUB_REPOSITORY_SLUG"

      - name: Assert MY_GITHUB_SHA_SHORT is set with prefix
        run: |
          echo "MY_GITHUB_SHA_SHORT: $MY_GITHUB_SHA_SHORT"
          if [ -z "$MY_GITHUB_SHA_SHORT" ]; then
            echo "FAIL: MY_GITHUB_SHA_SHORT is empty"
            exit 1
          fi
          echo "PASS: MY_GITHUB_SHA_SHORT=$MY_GITHUB_SHA_SHORT"

      - name: Assert non-prefixed variables are NOT set
        run: |
          echo "GITHUB_REF_SLUG (should be empty): '$GITHUB_REF_SLUG'"
          if [ -n "$GITHUB_REF_SLUG" ]; then
            echo "WARN: GITHUB_REF_SLUG is set without prefix (may be set by other means)"
          fi
          echo "PASS: prefix check complete"
