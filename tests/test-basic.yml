name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Debug - print all slug env vars
        run: |
          echo "=== GitHub context ==="
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "GITHUB_REF: $GITHUB_REF"
          echo "GITHUB_SHA: $GITHUB_SHA"
          echo "=== Slug vars ==="
          echo "GITHUB_REPOSITORY_SLUG: $GITHUB_REPOSITORY_SLUG"
          echo "GITHUB_REPOSITORY_SLUG_URL: $GITHUB_REPOSITORY_SLUG_URL"
          echo "GITHUB_REPOSITORY_OWNER_PART_SLUG: $GITHUB_REPOSITORY_OWNER_PART_SLUG"
          echo "GITHUB_REPOSITORY_NAME_PART_SLUG: $GITHUB_REPOSITORY_NAME_PART_SLUG"
          echo "GITHUB_REF_SLUG: $GITHUB_REF_SLUG"
          echo "GITHUB_REF_NAME_SLUG: $GITHUB_REF_NAME_SLUG"
          echo "GITHUB_REF_POINT_SLUG: $GITHUB_REF_POINT_SLUG"
          echo "GITHUB_SHA_SHORT: $GITHUB_SHA_SHORT"
          echo "=== All env vars with SLUG ==="
          env | grep -i slug || true
          echo "=== All env vars with SHORT ==="
          env | grep -i short || true
      - name: Assert GITHUB_REPOSITORY_SLUG is set
        run: |
          echo "GITHUB_REPOSITORY_SLUG: $GITHUB_REPOSITORY_SLUG"
          if [ -z "$GITHUB_REPOSITORY_SLUG" ]; then
            echo "FAIL: GITHUB_REPOSITORY_SLUG is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert GITHUB_REPOSITORY_SLUG contains no slash
        run: |
          echo "GITHUB_REPOSITORY_SLUG: $GITHUB_REPOSITORY_SLUG"
          if echo "$GITHUB_REPOSITORY_SLUG" | grep -q '/'; then
            echo "FAIL: GITHUB_REPOSITORY_SLUG contains a slash"
            exit 1
          fi
          echo "PASS"
      - name: Assert GITHUB_REPOSITORY_OWNER_PART_SLUG is set
        run: |
          echo "GITHUB_REPOSITORY_OWNER_PART_SLUG: $GITHUB_REPOSITORY_OWNER_PART_SLUG"
          if [ -z "$GITHUB_REPOSITORY_OWNER_PART_SLUG" ]; then
            echo "FAIL: GITHUB_REPOSITORY_OWNER_PART_SLUG is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert GITHUB_REPOSITORY_NAME_PART_SLUG is set
        run: |
          echo "GITHUB_REPOSITORY_NAME_PART_SLUG: $GITHUB_REPOSITORY_NAME_PART_SLUG"
          if [ -z "$GITHUB_REPOSITORY_NAME_PART_SLUG" ]; then
            echo "FAIL: GITHUB_REPOSITORY_NAME_PART_SLUG is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert GITHUB_SHA_SHORT is set
        run: |
          echo "GITHUB_SHA_SHORT: $GITHUB_SHA_SHORT"
          if [ -z "$GITHUB_SHA_SHORT" ]; then
            echo "FAIL: GITHUB_SHA_SHORT is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert GITHUB_REF_SLUG is set
        run: |
          echo "GITHUB_REF_SLUG: $GITHUB_REF_SLUG"
          if [ -z "$GITHUB_REF_SLUG" ]; then
            echo "FAIL: GITHUB_REF_SLUG is empty"
            exit 1
          fi
          echo "PASS"
