name: Test slug format validity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Debug - print all slug env vars
        run: |
          echo "=== All slug vars ==="
          env | grep -i slug || true
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "GITHUB_REF: $GITHUB_REF"
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
      - name: Assert GITHUB_REPOSITORY_SLUG has valid slug format
        run: |
          echo "GITHUB_REPOSITORY_SLUG: $GITHUB_REPOSITORY_SLUG"
          if [ -z "$GITHUB_REPOSITORY_SLUG" ]; then
            echo "FAIL: GITHUB_REPOSITORY_SLUG is empty"
            exit 1
          fi
          # Slug should only contain lowercase alphanumeric and hyphens, no slashes
          if echo "$GITHUB_REPOSITORY_SLUG" | grep -q '/'; then
            echo "FAIL: GITHUB_REPOSITORY_SLUG contains a slash: $GITHUB_REPOSITORY_SLUG"
            exit 1
          fi
          echo "PASS"
      - name: Assert GITHUB_REPOSITORY_OWNER_PART_SLUG has valid slug format
        run: |
          echo "GITHUB_REPOSITORY_OWNER_PART_SLUG: $GITHUB_REPOSITORY_OWNER_PART_SLUG"
          if [ -z "$GITHUB_REPOSITORY_OWNER_PART_SLUG" ]; then
            echo "FAIL: GITHUB_REPOSITORY_OWNER_PART_SLUG is empty"
            exit 1
          fi
          if echo "$GITHUB_REPOSITORY_OWNER_PART_SLUG" | grep -q '/'; then
            echo "FAIL: GITHUB_REPOSITORY_OWNER_PART_SLUG contains a slash: $GITHUB_REPOSITORY_OWNER_PART_SLUG"
            exit 1
          fi
          echo "PASS"
      - name: Assert GITHUB_REPOSITORY_NAME_PART_SLUG has valid slug format
        run: |
          echo "GITHUB_REPOSITORY_NAME_PART_SLUG: $GITHUB_REPOSITORY_NAME_PART_SLUG"
          if [ -z "$GITHUB_REPOSITORY_NAME_PART_SLUG" ]; then
            echo "FAIL: GITHUB_REPOSITORY_NAME_PART_SLUG is empty"
            exit 1
          fi
          if echo "$GITHUB_REPOSITORY_NAME_PART_SLUG" | grep -q '/'; then
            echo "FAIL: GITHUB_REPOSITORY_NAME_PART_SLUG contains a slash: $GITHUB_REPOSITORY_NAME_PART_SLUG"
            exit 1
          fi
          echo "PASS"
      - name: Assert GITHUB_REF_SLUG is set
        run: |
          echo "GITHUB_REF_SLUG: $GITHUB_REF_SLUG"
          if [ -z "$GITHUB_REF_SLUG" ]; then
            echo "FAIL: GITHUB_REF_SLUG is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert GITHUB_REF_NAME_SLUG is set
        run: |
          echo "GITHUB_REF_NAME_SLUG: $GITHUB_REF_NAME_SLUG"
          if [ -z "$GITHUB_REF_NAME_SLUG" ]; then
            echo "FAIL: GITHUB_REF_NAME_SLUG is empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert GITHUB_REF_POINT_SLUG is set
        run: |
          echo "GITHUB_REF_POINT_SLUG: $GITHUB_REF_POINT_SLUG"
          if [ -z "$GITHUB_REF_POINT_SLUG" ]; then
            echo "FAIL: GITHUB_REF_POINT_SLUG is empty"
            exit 1
          fi
          echo "PASS"
