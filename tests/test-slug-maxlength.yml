name: Test slug-maxlength input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run github-slug-action with short maxlength
        uses: .
        with:
          slug-maxlength: "10"

      - name: Assert GITHUB_REPOSITORY_SLUG respects maxlength
        run: |
          echo "GITHUB_REPOSITORY_SLUG: $GITHUB_REPOSITORY_SLUG"
          if [ -z "$GITHUB_REPOSITORY_SLUG" ]; then
            echo "FAIL: GITHUB_REPOSITORY_SLUG is empty"
            exit 1
          fi
          LEN=${#GITHUB_REPOSITORY_SLUG}
          echo "Length: $LEN"
          if [ "$LEN" -gt 10 ]; then
            echo "FAIL: GITHUB_REPOSITORY_SLUG length $LEN exceeds maxlength 10"
            exit 1
          fi
          echo "PASS: GITHUB_REPOSITORY_SLUG=$GITHUB_REPOSITORY_SLUG (length=$LEN)"

      - name: Assert GITHUB_REF_SLUG respects maxlength
        run: |
          echo "GITHUB_REF_SLUG: $GITHUB_REF_SLUG"
          if [ -z "$GITHUB_REF_SLUG" ]; then
            echo "FAIL: GITHUB_REF_SLUG is empty"
            exit 1
          fi
          LEN=${#GITHUB_REF_SLUG}
          echo "Length: $LEN"
          if [ "$LEN" -gt 10 ]; then
            echo "FAIL: GITHUB_REF_SLUG length $LEN exceeds maxlength 10"
            exit 1
          fi
          echo "PASS: GITHUB_REF_SLUG=$GITHUB_REF_SLUG (length=$LEN)"

      - name: Assert GITHUB_REF_NAME_SLUG respects maxlength
        run: |
          echo "GITHUB_REF_NAME_SLUG: $GITHUB_REF_NAME_SLUG"
          if [ -z "$GITHUB_REF_NAME_SLUG" ]; then
            echo "FAIL: GITHUB_REF_NAME_SLUG is empty"
            exit 1
          fi
          LEN=${#GITHUB_REF_NAME_SLUG}
          echo "Length: $LEN"
          if [ "$LEN" -gt 10 ]; then
            echo "FAIL: GITHUB_REF_NAME_SLUG length $LEN exceeds maxlength 10"
            exit 1
          fi
          echo "PASS: GITHUB_REF_NAME_SLUG=$GITHUB_REF_NAME_SLUG (length=$LEN)"

      - name: Assert GITHUB_REPOSITORY_OWNER_PART_SLUG respects maxlength
        run: |
          echo "GITHUB_REPOSITORY_OWNER_PART_SLUG: $GITHUB_REPOSITORY_OWNER_PART_SLUG"
          if [ -z "$GITHUB_REPOSITORY_OWNER_PART_SLUG" ]; then
            echo "FAIL: GITHUB_REPOSITORY_OWNER_PART_SLUG is empty"
            exit 1
          fi
          LEN=${#GITHUB_REPOSITORY_OWNER_PART_SLUG}
          echo "Length: $LEN"
          if [ "$LEN" -gt 10 ]; then
            echo "FAIL: GITHUB_REPOSITORY_OWNER_PART_SLUG length $LEN exceeds maxlength 10"
            exit 1
          fi
          echo "PASS: GITHUB_REPOSITORY_OWNER_PART_SLUG=$GITHUB_REPOSITORY_OWNER_PART_SLUG (length=$LEN)"
