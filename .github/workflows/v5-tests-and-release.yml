name: "[v5] Test and Release"
on: [push, pull_request]
permissions: {}
jobs:
  check-v4-compatibility:
    name: "Check v4 compatibility"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Load this action from HEAD
        uses: ./

      - name: Load using v4
        uses: rlespinasse/github-slug-action@797d68864753cbceedc271349d402da4590e6302 # v4
        with:
          prefix: V4_

      - name: Validate // Partial variables
        env:
          GITHUB_REPOSITORY_OWNER_PART: ${{ env.GITHUB_REPOSITORY_OWNER_PART }}
          V4_GITHUB_REPOSITORY_OWNER_PART: ${{ env.V4_GITHUB_REPOSITORY_OWNER_PART }}
          GITHUB_REPOSITORY_NAME_PART: ${{ env.GITHUB_REPOSITORY_NAME_PART }}
          V4_GITHUB_REPOSITORY_NAME_PART: ${{ env.V4_GITHUB_REPOSITORY_NAME_PART }}
        run: |
          [[ "$GITHUB_REPOSITORY_OWNER_PART" == "$V4_GITHUB_REPOSITORY_OWNER_PART" ]]
          [[ "$GITHUB_REPOSITORY_NAME_PART" == "$V4_GITHUB_REPOSITORY_NAME_PART" ]]
        shell: bash

      - name: Validate // Slug variables
        env:
          GITHUB_REPOSITORY_SLUG: ${{ env.GITHUB_REPOSITORY_SLUG }}
          V4_GITHUB_REPOSITORY_SLUG: ${{ env.V4_GITHUB_REPOSITORY_SLUG }}
          GITHUB_REPOSITORY_OWNER_PART_SLUG: ${{ env.GITHUB_REPOSITORY_OWNER_PART_SLUG }}
          V4_GITHUB_REPOSITORY_OWNER_PART_SLUG: ${{ env.V4_GITHUB_REPOSITORY_OWNER_PART_SLUG }}
          GITHUB_REPOSITORY_NAME_PART_SLUG: ${{ env.GITHUB_REPOSITORY_NAME_PART_SLUG }}
          V4_GITHUB_REPOSITORY_NAME_PART_SLUG: ${{ env.V4_GITHUB_REPOSITORY_NAME_PART_SLUG }}
          GITHUB_REF_SLUG: ${{ env.GITHUB_REF_SLUG }}
          V4_GITHUB_REF_SLUG: ${{ env.V4_GITHUB_REF_SLUG }}
          GITHUB_HEAD_REF_SLUG: ${{ env.GITHUB_HEAD_REF_SLUG }}
          V4_GITHUB_HEAD_REF_SLUG: ${{ env.V4_GITHUB_HEAD_REF_SLUG }}
          GITHUB_BASE_REF_SLUG: ${{ env.GITHUB_BASE_REF_SLUG }}
          V4_GITHUB_BASE_REF_SLUG: ${{ env.V4_GITHUB_BASE_REF_SLUG }}
          GITHUB_EVENT_REF_SLUG: ${{ env.GITHUB_EVENT_REF_SLUG }}
          V4_GITHUB_EVENT_REF_SLUG: ${{ env.V4_GITHUB_EVENT_REF_SLUG }}
        run: |
          [[ "$GITHUB_REPOSITORY_SLUG" == "$V4_GITHUB_REPOSITORY_SLUG" ]]
          [[ "$GITHUB_REPOSITORY_OWNER_PART_SLUG" == "$V4_GITHUB_REPOSITORY_OWNER_PART_SLUG" ]]
          [[ "$GITHUB_REPOSITORY_NAME_PART_SLUG" == "$V4_GITHUB_REPOSITORY_NAME_PART_SLUG" ]]
          [[ "$GITHUB_REF_SLUG" == "$V4_GITHUB_REF_SLUG" ]]
          [[ "$GITHUB_HEAD_REF_SLUG" == "$V4_GITHUB_HEAD_REF_SLUG" ]]
          [[ "$GITHUB_BASE_REF_SLUG" == "$V4_GITHUB_BASE_REF_SLUG" ]]
          [[ "$GITHUB_EVENT_REF_SLUG" == "$V4_GITHUB_EVENT_REF_SLUG" ]]
        shell: bash
      - name: Validate // Slug variables (Case Sensitive)
        env:
          GITHUB_REPOSITORY_SLUG_CS: ${{ env.GITHUB_REPOSITORY_SLUG_CS }}
          V4_GITHUB_REPOSITORY_SLUG_CS: ${{ env.V4_GITHUB_REPOSITORY_SLUG_CS }}
          GITHUB_REPOSITORY_OWNER_PART_SLUG_CS: ${{ env.GITHUB_REPOSITORY_OWNER_PART_SLUG_CS }}
          V4_GITHUB_REPOSITORY_OWNER_PART_SLUG_CS: ${{ env.V4_GITHUB_REPOSITORY_OWNER_PART_SLUG_CS }}
          GITHUB_REPOSITORY_NAME_PART_SLUG_CS: ${{ env.GITHUB_REPOSITORY_NAME_PART_SLUG_CS }}
          V4_GITHUB_REPOSITORY_NAME_PART_SLUG_CS: ${{ env.V4_GITHUB_REPOSITORY_NAME_PART_SLUG_CS }}
          GITHUB_REF_SLUG_CS: ${{ env.GITHUB_REF_SLUG_CS }}
          V4_GITHUB_REF_SLUG_CS: ${{ env.V4_GITHUB_REF_SLUG_CS }}
          GITHUB_HEAD_REF_SLUG_CS: ${{ env.GITHUB_HEAD_REF_SLUG_CS }}
          V4_GITHUB_HEAD_REF_SLUG_CS: ${{ env.V4_GITHUB_HEAD_REF_SLUG_CS }}
          GITHUB_BASE_REF_SLUG_CS: ${{ env.GITHUB_BASE_REF_SLUG_CS }}
          V4_GITHUB_BASE_REF_SLUG_CS: ${{ env.V4_GITHUB_BASE_REF_SLUG_CS }}
          GITHUB_EVENT_REF_SLUG_CS: ${{ env.GITHUB_EVENT_REF_SLUG_CS }}
          V4_GITHUB_EVENT_REF_SLUG_CS: ${{ env.V4_GITHUB_EVENT_REF_SLUG_CS }}
        run: |
          [[ "$GITHUB_REPOSITORY_SLUG_CS" == "$V4_GITHUB_REPOSITORY_SLUG_CS" ]]
          [[ "$GITHUB_REPOSITORY_OWNER_PART_SLUG_CS" == "$V4_GITHUB_REPOSITORY_OWNER_PART_SLUG_CS" ]]
          [[ "$GITHUB_REPOSITORY_NAME_PART_SLUG_CS" == "$V4_GITHUB_REPOSITORY_NAME_PART_SLUG_CS" ]]
          [[ "$GITHUB_REF_SLUG_CS" == "$V4_GITHUB_REF_SLUG_CS" ]]
          [[ "$GITHUB_HEAD_REF_SLUG_CS" == "$V4_GITHUB_HEAD_REF_SLUG_CS" ]]
          [[ "$GITHUB_BASE_REF_SLUG_CS" == "$V4_GITHUB_BASE_REF_SLUG_CS" ]]
          [[ "$GITHUB_EVENT_REF_SLUG_CS" == "$V4_GITHUB_EVENT_REF_SLUG_CS" ]]
        shell: bash
      - name: Validate // Slug URL variables
        env:
          GITHUB_REPOSITORY_SLUG_URL: ${{ env.GITHUB_REPOSITORY_SLUG_URL }}
          V4_GITHUB_REPOSITORY_SLUG_URL: ${{ env.V4_GITHUB_REPOSITORY_SLUG_URL }}
          GITHUB_REPOSITORY_OWNER_PART_SLUG_URL: ${{ env.GITHUB_REPOSITORY_OWNER_PART_SLUG_URL }}
          V4_GITHUB_REPOSITORY_OWNER_PART_SLUG_URL: ${{ env.V4_GITHUB_REPOSITORY_OWNER_PART_SLUG_URL }}
          GITHUB_REPOSITORY_NAME_PART_SLUG_URL: ${{ env.GITHUB_REPOSITORY_NAME_PART_SLUG_URL }}
          V4_GITHUB_REPOSITORY_NAME_PART_SLUG_URL: ${{ env.V4_GITHUB_REPOSITORY_NAME_PART_SLUG_URL }}
          GITHUB_REF_SLUG_URL: ${{ env.GITHUB_REF_SLUG_URL }}
          V4_GITHUB_REF_SLUG_URL: ${{ env.V4_GITHUB_REF_SLUG_URL }}
          GITHUB_HEAD_REF_SLUG_URL: ${{ env.GITHUB_HEAD_REF_SLUG_URL }}
          V4_GITHUB_HEAD_REF_SLUG_URL: ${{ env.V4_GITHUB_HEAD_REF_SLUG_URL }}
          GITHUB_BASE_REF_SLUG_URL: ${{ env.GITHUB_BASE_REF_SLUG_URL }}
          V4_GITHUB_BASE_REF_SLUG_URL: ${{ env.V4_GITHUB_BASE_REF_SLUG_URL }}
          GITHUB_EVENT_REF_SLUG_URL: ${{ env.GITHUB_EVENT_REF_SLUG_URL }}
          V4_GITHUB_EVENT_REF_SLUG_URL: ${{ env.V4_GITHUB_EVENT_REF_SLUG_URL }}
        run: |
          [[ "$GITHUB_REPOSITORY_SLUG_URL" == "$V4_GITHUB_REPOSITORY_SLUG_URL" ]]
          [[ "$GITHUB_REPOSITORY_OWNER_PART_SLUG_URL" == "$V4_GITHUB_REPOSITORY_OWNER_PART_SLUG_URL" ]]
          [[ "$GITHUB_REPOSITORY_NAME_PART_SLUG_URL" == "$V4_GITHUB_REPOSITORY_NAME_PART_SLUG_URL" ]]
          [[ "$GITHUB_REF_SLUG_URL" == "$V4_GITHUB_REF_SLUG_URL" ]]
          [[ "$GITHUB_HEAD_REF_SLUG_URL" == "$V4_GITHUB_HEAD_REF_SLUG_URL" ]]
          [[ "$GITHUB_BASE_REF_SLUG_URL" == "$V4_GITHUB_BASE_REF_SLUG_URL" ]]
          [[ "$GITHUB_EVENT_REF_SLUG_URL" == "$V4_GITHUB_EVENT_REF_SLUG_URL" ]]
        shell: bash
      - name: Validate // Slug URL variables (Case Sensitive)
        env:
          GITHUB_REPOSITORY_SLUG_URL_CS: ${{ env.GITHUB_REPOSITORY_SLUG_URL_CS }}
          V4_GITHUB_REPOSITORY_SLUG_URL_CS: ${{ env.V4_GITHUB_REPOSITORY_SLUG_URL_CS }}
          GITHUB_REPOSITORY_OWNER_PART_SLUG_URL_CS: ${{ env.GITHUB_REPOSITORY_OWNER_PART_SLUG_URL_CS }}
          V4_GITHUB_REPOSITORY_OWNER_PART_SLUG_URL_CS: ${{ env.V4_GITHUB_REPOSITORY_OWNER_PART_SLUG_URL_CS }}
          GITHUB_REPOSITORY_NAME_PART_SLUG_URL_CS: ${{ env.GITHUB_REPOSITORY_NAME_PART_SLUG_URL_CS }}
          V4_GITHUB_REPOSITORY_NAME_PART_SLUG_URL_CS: ${{ env.V4_GITHUB_REPOSITORY_NAME_PART_SLUG_URL_CS }}
          GITHUB_REF_SLUG_URL_CS: ${{ env.GITHUB_REF_SLUG_URL_CS }}
          V4_GITHUB_REF_SLUG_URL_CS: ${{ env.V4_GITHUB_REF_SLUG_URL_CS }}
          GITHUB_HEAD_REF_SLUG_URL_CS: ${{ env.GITHUB_HEAD_REF_SLUG_URL_CS }}
          V4_GITHUB_HEAD_REF_SLUG_URL_CS: ${{ env.V4_GITHUB_HEAD_REF_SLUG_URL_CS }}
          GITHUB_BASE_REF_SLUG_URL_CS: ${{ env.GITHUB_BASE_REF_SLUG_URL_CS }}
          V4_GITHUB_BASE_REF_SLUG_URL_CS: ${{ env.V4_GITHUB_BASE_REF_SLUG_URL_CS }}
          GITHUB_EVENT_REF_SLUG_URL_CS: ${{ env.GITHUB_EVENT_REF_SLUG_URL_CS }}
          V4_GITHUB_EVENT_REF_SLUG_URL_CS: ${{ env.V4_GITHUB_EVENT_REF_SLUG_URL_CS }}
        run: |
          [[ "$GITHUB_REPOSITORY_SLUG_URL_CS" == "$V4_GITHUB_REPOSITORY_SLUG_URL_CS" ]]
          [[ "$GITHUB_REPOSITORY_OWNER_PART_SLUG_URL_CS" == "$V4_GITHUB_REPOSITORY_OWNER_PART_SLUG_URL_CS" ]]
          [[ "$GITHUB_REPOSITORY_NAME_PART_SLUG_URL_CS" == "$V4_GITHUB_REPOSITORY_NAME_PART_SLUG_URL_CS" ]]
          [[ "$GITHUB_REF_SLUG_URL_CS" == "$V4_GITHUB_REF_SLUG_URL_CS" ]]
          [[ "$GITHUB_HEAD_REF_SLUG_URL_CS" == "$V4_GITHUB_HEAD_REF_SLUG_URL_CS" ]]
          [[ "$GITHUB_BASE_REF_SLUG_URL_CS" == "$V4_GITHUB_BASE_REF_SLUG_URL_CS" ]]
          [[ "$GITHUB_EVENT_REF_SLUG_URL_CS" == "$V4_GITHUB_EVENT_REF_SLUG_URL_CS" ]]
        shell: bash

      - name: Validate // Ref Point
        env:
          GITHUB_REF_POINT: ${{ env.GITHUB_REF_POINT }}
          V4_GITHUB_REF_NAME: ${{ env.V4_GITHUB_REF_NAME }}
          GITHUB_REF_POINT_SLUG: ${{ env.GITHUB_REF_POINT_SLUG }}
          V4_GITHUB_REF_NAME_SLUG: ${{ env.V4_GITHUB_REF_NAME_SLUG }}
          GITHUB_REF_POINT_SLUG_URL: ${{ env.GITHUB_REF_POINT_SLUG_URL }}
          V4_GITHUB_REF_NAME_SLUG_URL: ${{ env.V4_GITHUB_REF_NAME_SLUG_URL }}
          GITHUB_REF_POINT_SLUG_CS: ${{ env.GITHUB_REF_POINT_SLUG_CS }}
          V4_GITHUB_REF_NAME_SLUG_CS: ${{ env.V4_GITHUB_REF_NAME_SLUG_CS }}
          GITHUB_REF_POINT_SLUG_URL_CS: ${{ env.GITHUB_REF_POINT_SLUG_URL_CS }}
          V4_GITHUB_REF_NAME_SLUG_URL_CS: ${{ env.V4_GITHUB_REF_NAME_SLUG_URL_CS }}
        run: |
          [[ "$GITHUB_REF_POINT" == "$V4_GITHUB_REF_NAME" ]]
          [[ "$GITHUB_REF_POINT_SLUG" == "$V4_GITHUB_REF_NAME_SLUG" ]]
          [[ "$GITHUB_REF_POINT_SLUG_URL" == "$V4_GITHUB_REF_NAME_SLUG_URL" ]]
          [[ "$GITHUB_REF_POINT_SLUG_CS" == "$V4_GITHUB_REF_NAME_SLUG_CS" ]]
          [[ "$GITHUB_REF_POINT_SLUG_URL_CS" == "$V4_GITHUB_REF_NAME_SLUG_URL_CS" ]]
        shell: bash

      - name: Validate // Short SHA variables
        env:
          GITHUB_SHA_SHORT: ${{ env.GITHUB_SHA_SHORT }}
          V4_GITHUB_SHA_SHORT: ${{ env.V4_GITHUB_SHA_SHORT }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT: ${{ env.GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT }}
          V4_GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT: ${{ env.V4_GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT }}
        run: |
          [[ "$GITHUB_SHA_SHORT" == "$V4_GITHUB_SHA_SHORT" ]]
          [[ "$GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT" == "$V4_GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT" ]]
        shell: bash

  check-v4-compatibility-without-checkout:
    name: "Check v4 compatibility (without checkout)"
    needs:
      - check-v4-compatibility
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: this-action
          ref: ${{ github.ref }}

      - name: Load this action from HEAD
        uses: ./this-action

      - name: Load using v4
        uses: rlespinasse/github-slug-action@797d68864753cbceedc271349d402da4590e6302 # v4
        with:
          prefix: V4_

      - name: Validate // Short SHA variables
        env:
          GITHUB_SHA_SHORT: ${{ env.GITHUB_SHA_SHORT }}
          V4_GITHUB_SHA_SHORT: ${{ env.V4_GITHUB_SHA_SHORT }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT: ${{ env.GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT }}
          V4_GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT: ${{ env.V4_GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT }}
        run: |
          [[ "$GITHUB_SHA_SHORT" == "$V4_GITHUB_SHA_SHORT" ]]
          [[ "$GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT" == "$V4_GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT" ]]
        shell: bash

  display:
    name: "Display produced variables"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Load this action from HEAD
        uses: ./

      - name: Partial variables
        env:
          GITHUB_REPOSITORY_OWNER_PART: ${{ env.GITHUB_REPOSITORY_OWNER_PART }}
          GITHUB_REPOSITORY_NAME_PART: ${{ env.GITHUB_REPOSITORY_NAME_PART }}
        run: |
          echo "repository owner : $GITHUB_REPOSITORY_OWNER_PART"
          echo "repository name  : $GITHUB_REPOSITORY_NAME_PART"
        shell: bash

      - name: Slug variables
        env:
          GITHUB_REPOSITORY_SLUG: ${{ env.GITHUB_REPOSITORY_SLUG }}
          GITHUB_REPOSITORY_OWNER_PART_SLUG: ${{ env.GITHUB_REPOSITORY_OWNER_PART_SLUG }}
          GITHUB_REPOSITORY_NAME_PART_SLUG: ${{ env.GITHUB_REPOSITORY_NAME_PART_SLUG }}
          GITHUB_REF_SLUG: ${{ env.GITHUB_REF_SLUG }}
          GITHUB_REF_NAME_SLUG: ${{ env.GITHUB_REF_NAME_SLUG }}
          GITHUB_HEAD_REF_SLUG: ${{ env.GITHUB_HEAD_REF_SLUG }}
          GITHUB_BASE_REF_SLUG: ${{ env.GITHUB_BASE_REF_SLUG }}
          GITHUB_EVENT_REF_SLUG: ${{ env.GITHUB_EVENT_REF_SLUG }}
        run: |
          echo "repository       : $GITHUB_REPOSITORY_SLUG"
          echo "repository owner : $GITHUB_REPOSITORY_OWNER_PART_SLUG"
          echo "repository name  : $GITHUB_REPOSITORY_NAME_PART_SLUG"
          echo "ref              : $GITHUB_REF_SLUG"
          echo "ref name         : $GITHUB_REF_NAME_SLUG"
          echo "head ref         : $GITHUB_HEAD_REF_SLUG"
          echo "base ref         : $GITHUB_BASE_REF_SLUG"
          echo "event ref        : $GITHUB_EVENT_REF_SLUG"
        shell: bash

      - name: Slug variables (Case Sensitive)
        env:
          GITHUB_REPOSITORY_SLUG_CS: ${{ env.GITHUB_REPOSITORY_SLUG_CS }}
          GITHUB_REPOSITORY_OWNER_PART_SLUG_CS: ${{ env.GITHUB_REPOSITORY_OWNER_PART_SLUG_CS }}
          GITHUB_REPOSITORY_NAME_PART_SLUG_CS: ${{ env.GITHUB_REPOSITORY_NAME_PART_SLUG_CS }}
          GITHUB_REF_SLUG_CS: ${{ env.GITHUB_REF_SLUG_CS }}
          GITHUB_REF_NAME_SLUG_CS: ${{ env.GITHUB_REF_NAME_SLUG_CS }}
          GITHUB_HEAD_REF_SLUG_CS: ${{ env.GITHUB_HEAD_REF_SLUG_CS }}
          GITHUB_BASE_REF_SLUG_CS: ${{ env.GITHUB_BASE_REF_SLUG_CS }}
          GITHUB_EVENT_REF_SLUG_CS: ${{ env.GITHUB_EVENT_REF_SLUG_CS }}
        run: |
          echo "repository       : $GITHUB_REPOSITORY_SLUG_CS"
          echo "repository owner : $GITHUB_REPOSITORY_OWNER_PART_SLUG_CS"
          echo "repository name  : $GITHUB_REPOSITORY_NAME_PART_SLUG_CS"
          echo "ref              : $GITHUB_REF_SLUG_CS"
          echo "ref name         : $GITHUB_REF_NAME_SLUG_CS"
          echo "head ref         : $GITHUB_HEAD_REF_SLUG_CS"
          echo "base ref         : $GITHUB_BASE_REF_SLUG_CS"
          echo "event ref        : $GITHUB_EVENT_REF_SLUG_CS"
        shell: bash

      - name: Slug URL variables
        env:
          GITHUB_REPOSITORY_SLUG_URL: ${{ env.GITHUB_REPOSITORY_SLUG_URL }}
          GITHUB_REPOSITORY_OWNER_PART_SLUG_URL: ${{ env.GITHUB_REPOSITORY_OWNER_PART_SLUG_URL }}
          GITHUB_REPOSITORY_NAME_PART_SLUG_URL: ${{ env.GITHUB_REPOSITORY_NAME_PART_SLUG_URL }}
          GITHUB_REF_SLUG_URL: ${{ env.GITHUB_REF_SLUG_URL }}
          GITHUB_REF_NAME_SLUG_URL: ${{ env.GITHUB_REF_NAME_SLUG_URL }}
          GITHUB_HEAD_REF_SLUG_URL: ${{ env.GITHUB_HEAD_REF_SLUG_URL }}
          GITHUB_BASE_REF_SLUG_URL: ${{ env.GITHUB_BASE_REF_SLUG_URL }}
          GITHUB_EVENT_REF_SLUG_URL: ${{ env.GITHUB_EVENT_REF_SLUG_URL }}
        run: |
          echo "repository       : $GITHUB_REPOSITORY_SLUG_URL"
          echo "repository owner : $GITHUB_REPOSITORY_OWNER_PART_SLUG_URL"
          echo "repository name  : $GITHUB_REPOSITORY_NAME_PART_SLUG_URL"
          echo "ref              : $GITHUB_REF_SLUG_URL"
          echo "ref name         : $GITHUB_REF_NAME_SLUG_URL"
          echo "head ref         : $GITHUB_HEAD_REF_SLUG_URL"
          echo "base ref         : $GITHUB_BASE_REF_SLUG_URL"
          echo "event ref        : $GITHUB_EVENT_REF_SLUG_URL"
        shell: bash

      - name: Slug URL variables (Case Sensitive)
        env:
          GITHUB_REPOSITORY_SLUG_URL_CS: ${{ env.GITHUB_REPOSITORY_SLUG_URL_CS }}
          GITHUB_REPOSITORY_OWNER_PART_SLUG_URL_CS: ${{ env.GITHUB_REPOSITORY_OWNER_PART_SLUG_URL_CS }}
          GITHUB_REPOSITORY_NAME_PART_SLUG_URL_CS: ${{ env.GITHUB_REPOSITORY_NAME_PART_SLUG_URL_CS }}
          GITHUB_REF_SLUG_URL_CS: ${{ env.GITHUB_REF_SLUG_URL_CS }}
          GITHUB_REF_NAME_SLUG_URL_CS: ${{ env.GITHUB_REF_NAME_SLUG_URL_CS }}
          GITHUB_HEAD_REF_SLUG_URL_CS: ${{ env.GITHUB_HEAD_REF_SLUG_URL_CS }}
          GITHUB_BASE_REF_SLUG_URL_CS: ${{ env.GITHUB_BASE_REF_SLUG_URL_CS }}
          GITHUB_EVENT_REF_SLUG_URL_CS: ${{ env.GITHUB_EVENT_REF_SLUG_URL_CS }}
        run: |
          echo "repository       : $GITHUB_REPOSITORY_SLUG_URL_CS"
          echo "repository owner : $GITHUB_REPOSITORY_OWNER_PART_SLUG_URL_CS"
          echo "repository name  : $GITHUB_REPOSITORY_NAME_PART_SLUG_URL_CS"
          echo "ref              : $GITHUB_REF_SLUG_URL_CS"
          echo "ref name         : $GITHUB_REF_NAME_SLUG_URL_CS"
          echo "head ref         : $GITHUB_HEAD_REF_SLUG_URL_CS"
          echo "base ref         : $GITHUB_BASE_REF_SLUG_URL_CS"
          echo "event ref        : $GITHUB_EVENT_REF_SLUG_URL_CS"
        shell: bash

      - name: Ref Point
        env:
          GITHUB_REF_POINT: ${{ env.GITHUB_REF_POINT }}
          GITHUB_REF_POINT_SLUG: ${{ env.GITHUB_REF_POINT_SLUG }}
          GITHUB_REF_POINT_SLUG_URL: ${{ env.GITHUB_REF_POINT_SLUG_URL }}
          GITHUB_REF_POINT_SLUG_CS: ${{ env.GITHUB_REF_POINT_SLUG_CS }}
          GITHUB_REF_POINT_SLUG_URL_CS: ${{ env.GITHUB_REF_POINT_SLUG_URL_CS }}
        run: |
          echo "raw                       : $GITHUB_REF_POINT"
          echo "slug                      : $GITHUB_REF_POINT_SLUG"
          echo "slug url                  : $GITHUB_REF_POINT_SLUG_URL"
          echo "slug (Case Sensitive)     : $GITHUB_REF_POINT_SLUG_CS"
          echo "slug url (Case Sensitive) : $GITHUB_REF_POINT_SLUG_URL_CS"
        shell: bash

      - name: Short SHA variables
        env:
          GITHUB_SHA_SHORT: ${{ env.GITHUB_SHA_SHORT }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT: ${{ env.GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT }}
        run: |
          echo "sha              : $GITHUB_SHA_SHORT"
          echo "pull request sha : $GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT"
        shell: bash

  display-without-checkout:
    name: "Display produced variables (without checkout)"
    needs:
      - display
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: this-action
          ref: ${{ github.ref }}

      - name: Load this action from HEAD
        uses: ./this-action

      - name: Short SHA variables
        env:
          GITHUB_SHA_SHORT: ${{ env.GITHUB_SHA_SHORT }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT: ${{ env.GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT }}
        run: |
          echo "sha              : $GITHUB_SHA_SHORT"
          echo "pull request sha : $GITHUB_EVENT_PULL_REQUEST_HEAD_SHA_SHORT"
        shell: bash

  input-short-length:
    name: "Input 'short-length'"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Test 1
      - name: Using correct short length
        uses: ./
        with:
          prefix: "CSL_"
          short-length: 4
      - name: Using correct length // Validate that all short variables lengths are equals to short-length
        run: |
          env | grep "CSL_" | grep "_SHORT" | cut -d"=" -f2 | while read -r value; do [ "${#value}" -le 5 ] ; done
        shell: bash

      # Test 2
      - name: Using wrong short length
        id: using-wrong-short-length
        uses: ./
        with:
          prefix: "WSL_"
          short-length: "wrong"
        continue-on-error: true
      - name: Using wrong short length // Validate that the action end with an error
        env:
          USING_WRONG_SHORT_LENGTH_OUTCOME: ${{ steps.using-wrong-short-length.outcome }}
          USING_WRONG_SHORT_LENGTH_CONCLUSION: ${{ steps.using-wrong-short-length.conclusion }}
        run: |
          [[ "$(env | grep "WSL_" | grep "_SHORT" -c)" -eq 0 ]]
          [[ "$USING_WRONG_SHORT_LENGTH_OUTCOME" == "failure" ]]
          [[ "$USING_WRONG_SHORT_LENGTH_CONCLUSION" == "success" ]]
        shell: bash

  input-short-length-without-checkout:
    name: "Input 'short-length' (without checkout)"
    needs:
      - input-short-length
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: this-action
          ref: ${{ github.ref }}

      # Test 1
      - name: Using correct short length
        uses: ./this-action
        with:
          prefix: "CSL_"
          short-length: 4
      - name: Using correct length // Validate that all short variables lengths are equals to short-length
        run: |
          env | grep "CSL_" | grep "_SHORT" | cut -d"=" -f2 | while read -r value; do [ "${#value}" -le 5 ] ; done
        shell: bash

      # Test 2
      - name: Using empty short length
        id: using-empty-short-length
        uses: ./this-action
        with:
          prefix: "ESL_"
        continue-on-error: true
      - name: Using empty short length // Validate that the action don't end with an error
        env:
          USING_EMPTY_SHORT_LENGTH_OUTCOME: ${{ steps.using-empty-short-length.outcome }}
          USING_EMPTY_SHORT_LENGTH_CONCLUSION: ${{ steps.using-empty-short-length.conclusion }}
        run: |
          [[ "$(env | grep "ESL_" | grep "_SHORT" -c)" -gt 0 ]]
          [[ "$USING_EMPTY_SHORT_LENGTH_OUTCOME" == "success" ]]
          [[ "$USING_EMPTY_SHORT_LENGTH_CONCLUSION" == "success" ]]
        shell: bash

      # Test 3
      - name: Using wrong short length
        id: using-wrong-short-length
        uses: ./this-action
        with:
          prefix: "WSL_"
          short-length: "wrong"
        continue-on-error: true
      - name: Using wrong short length // Validate that the action end with an error
        env:
          USING_WRONG_SHORT_LENGTH_OUTCOME: ${{ steps.using-wrong-short-length.outcome }}
          USING_WRONG_SHORT_LENGTH_CONCLUSION: ${{ steps.using-wrong-short-length.conclusion }}
        run: |
          [[ "$(env | grep "WSL_" | grep "_SHORT" -c)" -eq 0 ]]
          [[ "$USING_WRONG_SHORT_LENGTH_OUTCOME" == "failure" ]]
          [[ "$USING_WRONG_SHORT_LENGTH_CONCLUSION" == "success" ]]
        shell: bash

  input-slug-maxlength:
    name: "Input 'slug-maxlength'"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Test 1
      - name: Using correct slug max length
        uses: ./
        with:
          prefix: "CML_"
          slug-maxlength: 1
      - name: Using correct max length // Validate that all slug variables lengths are equals or under the slug-maxlength
        run: |
          env | grep "CML_" | grep "_SLUG" | cut -d"=" -f2 | while read -r value; do [ "${#value}" -le 2 ] ; done
        shell: bash

      # Test 2
      - name: Using wrong slug max length
        id: using-wrong-slug-max-length
        uses: ./
        with:
          prefix: "WML_"
          slug-maxlength: "wrong"
        continue-on-error: true
      - name: Using wrong slug max length // Validate that the action end with an error
        env:
          USING_WRONG_SLUG_MAX_LENGTH_OUTCOME: ${{ steps.using-wrong-slug-max-length.outcome }}
          USING_WRONG_SLUG_MAX_LENGTH_CONCLUSION: ${{ steps.using-wrong-slug-max-length.conclusion }}
        run: |
          [[ "$(env | grep "WML_" | grep "_SLUG" -c)" -eq 0 ]]
          [[ "$USING_WRONG_SLUG_MAX_LENGTH_OUTCOME" == "failure" ]]
          [[ "$USING_WRONG_SLUG_MAX_LENGTH_CONCLUSION" == "success" ]]
        shell: bash

      # Test 3
      - name: Using empty slug max length
        id: using-empty-slug-max-length
        uses: ./
        with:
          prefix: "EML_"
          slug-maxlength: ""
        continue-on-error: true
      - name: Using empty slug max length // Validate that the action end with an error
        env:
          USING_EMPTY_SLUG_MAX_LENGTH_OUTCOME: ${{ steps.using-empty-slug-max-length.outcome }}
          USING_EMPTY_SLUG_MAX_LENGTH_CONCLUSION: ${{ steps.using-empty-slug-max-length.conclusion }}
        run: |
          [[ "$(env | grep "EML_" | grep "_SLUG" -c)" -eq 0 ]]
          [[ "$USING_EMPTY_SLUG_MAX_LENGTH_OUTCOME" == "failure" ]]
          [[ "$USING_EMPTY_SLUG_MAX_LENGTH_CONCLUSION" == "success" ]]
        shell: bash

      # Test 4
      - name: Using no limit on slug max length
        id: using-nolimit-slug-max-length
        uses: ./
        with:
          prefix: "NLML_"
          slug-maxlength: "nolimit"
      - name: Using no limit on slug max length // Validate that the action end with an error
        env:
          USING_NOLIMIT_SLUG_MAX_LENGTH_OUTCOME: ${{ steps.using-nolimit-slug-max-length.outcome }}
          USING_NOLIMIT_SLUG_MAX_LENGTH_CONCLUSION: ${{ steps.using-nolimit-slug-max-length.conclusion }}
        run: |
          [[ "$(env | grep "NLML_" | grep "_SLUG" -c)" -gt 0 ]]
          [[ "$USING_NOLIMIT_SLUG_MAX_LENGTH_OUTCOME" == "success" ]]
          [[ "$USING_NOLIMIT_SLUG_MAX_LENGTH_CONCLUSION" == "success" ]]
        shell: bash

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
      packages: write
    concurrency:
      group: release-${{ github.ref }}-${{ github.event_name }}
    needs:
      - display-without-checkout
      - input-short-length-without-checkout
      - input-slug-maxlength
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Release this GitHub Action
        uses: rlespinasse/release-that@f4912d4053839003bb368e9c7067b071ccb1c146 # v1
        with:
          github-token: ${{ secrets.GH_TOKEN }}
